services:

  mysql:
    image: mysql:8

    container_name: mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: hospitaldb
      MYSQL_USER: hospitaluser
      MYSQL_PASSWORD: hospitalpass

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  backend:

    build:
      context: ./backend

    container_name: backend

    restart: always

    env_file:
      - ./backend/.env

    depends_on:
      - mysql

    ports:
      - "4000:4000"

  frontend:

    build:
      context: ./frontend

    container_name: frontend

    restart: always

    depends_on:
      - backend

    ports:
      - "80:80"

volumes:
  mysql_data:
